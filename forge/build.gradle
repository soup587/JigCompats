plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

archivesBaseName = rootProject.archives_base_name + "-forge"

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "jigcompats-common.mixins.json"
        mixinConfig "jigcompats.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Libraries
    forgeRuntimeLibrary(modImplementation("com.github.FiguraMC.luaj:luaj-core:$luaj-figura"))
    forgeRuntimeLibrary(modImplementation("com.github.FiguraMC.luaj:luaj-jse:$luaj-figura"))
    forgeRuntimeLibrary(modImplementation("com.neovisionaries:nv-websocket-client:$nv_websocket"))

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))
    implementation("io.github.llamalad7:mixinextras-forge:0.3.6")

    modCompileOnly "maven.modrinth:timeless-and-classics-zero:$tacz_version"

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    modImplementation("com.tterrag.registrate:Registrate:${registrate}")

    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    // Figura forge
    modImplementation("org.figuramc:figura-forge:$figura_version")

    modImplementation("at.petra-k.hexcasting:hexcasting-forge-$minecraft_version:$hexcasting_version")
    implementation("thedarkcolour:kotlinforforge:4.10.0")
    modLocalRuntime("at.petra-k.paucal:paucal-forge-$minecraft_version:$paucal_version")
    modLocalRuntime("com.samsthenerd.inline:inline-forge:$minecraft_version-$inline_version") { transitive false }
    modLocalRuntime("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-FORGE")
    modLocalRuntime("top.theillusivec4.caelus:caelus-forge:3.1.0+1.20")

    modApi("me.shedaniel.cloth:cloth-config-forge:$cloth_config_version")

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
Map<String, Object> properties = new HashMap<>()

    properties.put("version", project.version)
    properties.put("java_version", rootProject.java_version)
    properties.put("minecraft_version", rootProject.minecraft_version)
    properties.put("figura_version", rootProject.figura_version)
    properties.put("mod_id", rootProject.plugin_id)
    properties.put("display_name", rootProject.display_name)
    properties.put("description", rootProject.description)
    properties.put("authors", rootProject.authors)

    properties.forEach((k, v) -> inputs.property(k, v.toString()))
    filesMatching("META-INF/mods.toml") {
        expand properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier =  "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier =  null
}

jar {
    archiveClassifier =  "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + "forge" + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

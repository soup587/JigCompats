plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

archivesBaseName = rootProject.archives_base_name + "-fabric"

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}

dependencies {
    // Libraries
    modImplementation("com.github.FiguraMC.luaj:luaj-core:$luaj-figura")
    modImplementation("com.github.FiguraMC.luaj:luaj-jse:$luaj-figura")
    modImplementation("com.neovisionaries:nv-websocket-client:$nv_websocket")
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.3.6"))

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Figura fabric
    modImplementation("org.figuramc:figura-fabric:$figura_version")

    modImplementation("at.petra-k.hexcasting:hexcasting-fabric-$minecraft_version:$hexcasting_version")
    modRuntimeOnly("net.fabricmc:fabric-language-kotlin:1.9.4+kotlin.1.8.21")
    modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-api:5.2.1")
    modLocalRuntime("at.petra-k.paucal:paucal-fabric-$minecraft_version:$paucal_version")
    modLocalRuntime("com.samsthenerd.inline:inline-fabric:$minecraft_version-$inline_version") { transitive false }
    modLocalRuntime("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-FABRIC")
    modLocalRuntime("io.github.tropheusj:serialization-hooks:0.4.99999")

    modApi("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
Map<String, Object> properties = new HashMap<>()

    properties.put("version", project.version)
    properties.put("java_version", rootProject.java_version)
    properties.put("minecraft_version", rootProject.minecraft_version)
    properties.put("figura_version", rootProject.figura_version)
    properties.put("fabric_api_version", rootProject.fabric_api_version)
    properties.put("mod_id", rootProject.plugin_id)
    properties.put("display_name", rootProject.display_name)
    properties.put("description", rootProject.description)
    properties.put("authors", rootProject.authors)

    properties.forEach((k, v) -> inputs.property(k, v.toString()))
    filesMatching("fabric.mod.json") {
        expand properties
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier =  "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier =  null
}

jar {
    archiveClassifier =  "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + "fabric" + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
